<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>demo-app</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Paints the remembered theme before the app boots, so a pinned dark
         theme never flashes light. The attribute is the source of truth;
         SheepThemeService only moves it. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sheep-ng:theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-sheep-theme', t);
          }
        } catch (e) {
          /* storage unavailable — fall back to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <sheep-app-root></sheep-app-root>
  </body>
</html>
