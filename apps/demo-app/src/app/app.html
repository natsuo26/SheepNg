<div class="app">
  <header class="app__bar">
    <div class="app__brand">
      <img
        class="app__mark"
        src="sheepng-icon-transparent-accent.svg"
        alt=""
        width="21"
        height="21"
      />
      <span class="app__name">sheep&#8209;ng</span>
      <span class="app__version">ui 0.1.0</span>
    </div>

    <nav class="app__nav" aria-label="Components">
      @for (item of components; track item.path) { @if (item.ready) {
      <a
        class="app__link"
        [routerLink]="item.path"
        routerLinkActive="app__link--on"
        >{{ item.label }}</a
      >
      } @else {
      <span class="app__link app__link--soon" aria-disabled="true"
        >{{ item.label }}</span
      >
      } }
    </nav>

    <sheep-theme-switcher />
  </header>

  <main class="app__main">
    <router-outlet />
  </main>
</div>
