<div class="app">
  <header class="app__header">
    <sheep-nav-bar ariaLabel="Components">
      <div sheepNavBarStart class="app__brand">
        <img
          class="app__mark"
          src="sheepng-icon-transparent-accent.svg"
          alt=""
          width="21"
          height="21"
        />
        <span class="app__name">sheep&#8209;ng</span>
        <span class="app__version">ui 0.1.0</span>
      </div>

      @for (item of components; track item.path) {
      <a
        sheep-nav-bar-item
        [routerLink]="item.path"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
      }

      <sheep-theme-switcher sheepNavBarEnd />
    </sheep-nav-bar>
  </header>

  <main class="app__main">
    <router-outlet />
  </main>
</div>
