<h2 class="sheep-dialog__title"><ng-content /></h2>

@if (dismissible()) {
  <sheep-button
    class="sheep-dialog__close"
    variant="ghost"
    tone="neutral"
    size="sm"
    shape="square"
    ariaLabel="Close dialog"
    (click)="close()"
  >
    <svg
      sheepButtonStart
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </sheep-button>
}
