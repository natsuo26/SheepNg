<div class="sheep-input__label-row">
  <label class="sheep-input__label" [attr.for]="inputId">
    <span class="sheep-input__label-text"
      ><ng-content select="[sheepInputLabel]"
    /></span>
    @if (required()) {
    <span class="sheep-input__required" aria-hidden="true">*</span>
    }
  </label>
</div>

<div class="sheep-input__box">
  <span class="sheep-input__affix sheep-input__affix--start"
    ><ng-content select="[sheepInputPrefix]"
  /></span>

  <input
    #input
    class="sheep-input__input"
    [id]="inputId"
    [attr.type]="resolvedType()"
    [attr.name]="name() || null"
    [attr.placeholder]="placeholder() || null"
    [attr.autocomplete]="autocomplete()"
    [attr.inputmode]="inputMode()"
    [attr.autocapitalize]="autoCapitalize()"
    [attr.autocorrect]="autoCorrect()"
    [attr.spellcheck]="spellcheck()"
    [attr.minlength]="minLength() ?? null"
    [attr.maxlength]="maxLength() ?? null"
    [attr.pattern]="nativePattern()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showErrors() ? 'true' : null"
    [attr.aria-errormessage]="showErrors() ? errorId : null"
    [attr.aria-busy]="pending() ? 'true' : null"
    [required]="required()"
    [readOnly]="readonly()"
    [disabled]="disabled()"
    [value]="value()"
    (beforeinput)="onBeforeInput($event)"
    (keydown)="onKeydown($event)"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  @if (pending()) {
  <span class="sheep-input__spinner" aria-hidden="true"></span>
  }

  <span class="sheep-input__affix sheep-input__affix--end"
    ><ng-content select="[sheepInputSuffix]"
  /></span>

  @for (action of actions(); track action.label) {
  <button
    type="button"
    class="sheep-input__action"
    [attr.aria-label]="action.label"
    [attr.aria-pressed]="action.pressed === undefined ? null : action.pressed"
    [attr.aria-controls]="inputId"
    [disabled]="disabled()"
    (mousedown)="$event.preventDefault()"
    (click)="action.run()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @for (path of action.icon; track $index) {
      <path [attr.d]="path" />
      }
    </svg>
  </button>
  }
</div>

<div class="sheep-input__footer">
  <div class="sheep-input__support">
    <span class="sheep-input__hint" [id]="hintId"
      ><ng-content select="[sheepInputHint]"
    /></span>

    @if (showErrors()) {
    <p class="sheep-input__error" [id]="errorId" role="alert">
      @for (message of messagesToShow(); track $index) {
      <span class="sheep-input__error-line">{{ message }}</span>
      }
    </p>
    }
  </div>

  @if (status()) {
  <span class="sheep-input__status" aria-hidden="true">{{ status() }}</span>
  }
</div>
