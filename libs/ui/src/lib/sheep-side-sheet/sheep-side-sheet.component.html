<!--
  The press handlers are the backdrop dismissal, not a control: the surface is
  the sheet around the panel, and clicking off it is a pointer gesture with no
  keyboard counterpart to mirror. Escape is the keyboard way out, and the
  (cancel) binding below is where it is answered. Making the surface focusable
  would put a stop in the tab order that leads nowhere.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #surface
  class="sheep-side-sheet__surface"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabel() ? null : titleId"
  (cancel)="onCancel($event)"
  (close)="onSurfaceClose()"
  (mousedown)="onSurfacePress($event)"
  (click)="onSurfaceClick($event)"
>
  <div class="sheep-side-sheet__panel">
    <ng-content select="sheep-side-sheet-header" />
    <ng-content select="sheep-side-sheet-body" />
    <ng-content />
    <ng-content select="sheep-side-sheet-footer" />
  </div>
</dialog>
